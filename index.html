<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="apple-touch-icon" href="%BASE_URL%pwa-icons/apple-touch-icon.png" />
    <!-- viewport-fit=cover: Android 15+(targetSdk 35+)는 edge-to-edge를 자동 강제해 WebView
         콘텐츠가 상태바 아래까지 그려진다. 이 값이 있어야 env(safe-area-inset-top)이 실제
         상태바 높이로 계산되어, 페이지 상단 padding(components/common/layout.jsx)이 콘텐츠를
         상태바 아래로 정확히 밀어낼 수 있다. 네이티브 코드는 건드리지 않는다. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#6BCB77" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="FitBuddy" />
    <title>my-react-app</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
